[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_lewam_jepa"
version = "0.1.0"
description = "LeWAM (arXiv 2610.12818) as a LeRobot policy plugin: a small JEPA world-action policy, type lewam_jepa"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE-lewam-MIT"]
requires-python = ">=3.12"
dependencies = [
    "lerobot==0.7.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8", "safetensors"]

[project.urls]
Repository = "https://github.com/ravediamond/lerobot-policy-lewam-jepa"
Paper = "https://arxiv.org/abs/2610.12818"
Upstream = "https://github.com/MinghaoFu/lewam"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/lerobot_policy_lewam_jepa/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = ["N812"]
